<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ภารกิจนักคิด</title><style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#10162b,#293d75);color:#fff;min-height:100vh}main{max-width:850px;margin:auto;padding:20px}.card{background:#ffffff18;border:1px solid #ffffff30;border-radius:22px;padding:25px}h1,.center{text-align:center}.top{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0}.badge{background:#0006;padding:8px 12px;border-radius:12px}.bar{height:10px;background:#0006;border-radius:10px;overflow:hidden}.fill{height:100%;background:#63e6a7;width:100%}#question{font-size:22px;line-height:1.5;margin:22px 0}.answers{display:grid;gap:12px}button{border:0;border-radius:14px;padding:14px;font-size:17px;cursor:pointer}.answers button:hover{background:#e8eeff}.power{display:flex;gap:10px;margin-top:14px}.power button{flex:1;background:#ffd866}.main{background:#63e6a7;font-weight:bold;margin-top:15px}.hidden{display:none}.good{color:#7dffbd}.bad{color:#ff9b9b}.big{font-size:40px;font-weight:bold}</style></head><body><main><div class="card">
<h1>🧠 ภารกิจนักคิด</h1><p class="center">10 ด่าน • 30 คำถาม • แนววิชาเรียน ยากนิดหน่อยแต่ตอบได้</p>
<section id="start" class="center"><p>คณิต • วิทยาศาสตร์ • ภาษาไทย • อังกฤษ • สังคม • เทคโนโลยี</p><p>❤️ 3 ชีวิต | ⏱️ 20 วินาที | 🔥 Combo | 💡 ตัวช่วย</p><button class="main" onclick="start()">เริ่มเกม</button></section>
<section id="game" class="hidden"><div class="top"><span class="badge">ด่าน <b id="lv">1</b>/10</span><span class="badge">ข้อ <b id="qn">1</b>/30</span><span class="badge">❤️ <b id="life">3</b></span><span class="badge">🏆 <b id="score">0</b></span><span class="badge">🔥 <b id="combo">0</b></span><span class="badge">⏱️ <b id="time">20</b></span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="question"></div><div id="answers" class="answers"></div><div class="power"><button id="cut" onclick="cut()">💡 ตัด 2 ตัวเลือก</button><button id="freeze" onclick="freeze()">⏸️ หยุดเวลา 5 วิ</button></div><div id="msg" class="center"></div></section>
<section id="end" class="hidden center"><div id="final" class="big"></div><h2 id="title"></h2><p id="result"></p><button class="main" onclick="location.reload()">เล่นใหม่</button></section>
</div></main><script>
const qs=[["คณิตศาสตร์: 2x+5=17 ค่า x เท่าไร?", ["5", "6", "7", "8"], 1], ["คณิตศาสตร์: 15% ของ 200 เท่าไร?", ["20", "25", "30", "35"], 2], ["คณิตศาสตร์: 3²+4² เท่าไร?", ["12", "18", "25", "49"], 2], ["คณิตศาสตร์: 2,4,8,16 จำนวนถัดไป?", ["20", "24", "30", "32"], 3], ["คณิตศาสตร์: ค่าเฉลี่ย 6,8,10,12 เท่าไร?", ["8", "9", "10", "11"], 1], ["วิทยาศาสตร์: พืชใช้แก๊สใดสังเคราะห์ด้วยแสง?", ["ออกซิเจน", "ไนโตรเจน", "คาร์บอนไดออกไซด์", "ไฮโดรเจน"], 2], ["วิทยาศาสตร์: หน่วยพื้นฐานของสิ่งมีชีวิตคือ?", ["เนื้อเยื่อ", "เซลล์", "อวัยวะ", "ระบบอวัยวะ"], 1], ["วิทยาศาสตร์: แรงที่ดึงวัตถุเข้าหาโลกคือ?", ["เสียดทาน", "แม่เหล็ก", "โน้มถ่วง", "พยุง"], 2], ["วิทยาศาสตร์: น้ำเดือดที่ระดับน้ำทะเลประมาณกี่ °C?", ["50", "75", "100", "120"], 2], ["วิทยาศาสตร์: การเปลี่ยนแปลงของตำแหน่งตามเวลาเกี่ยวข้องกับอะไร?", ["การเคลื่อนที่", "สี", "มวล", "ปริมาตร"], 0], ["ภาษาไทย: ข้อใดเป็นคำซ้อน?", ["บ้านเรือน", "รถยนต์", "นักเรียน", "โรงเรียน"], 0], ["ภาษาไทย: วิริยะ หมายถึง?", ["ความขยัน", "ความกลัว", "ความโกรธ", "ความเศร้า"], 0], ["ภาษาไทย: ข้อใดเป็นประโยคคำถาม?", ["วันนี้อากาศดี", "เธอไปโรงเรียนหรือยัง", "ฉันอ่านหนังสือ", "เขาชอบฟุตบอล"], 1], ["ภาษาไทย: จับใจความสำคัญควรเน้นอะไร?", ["ทุกคำ", "ประเด็นหลัก", "จำนวนย่อหน้า", "คำยาว"], 1], ["ภาษาไทย: ภาษาใดเหมาะกับรายงาน?", ["มันเจ๋งมาก", "โครงงานนี้มีวัตถุประสงค์เพื่อศึกษา", "แบบนี้ก็ดีนะ", "สุดยอดเลย"], 1], ["English: past tense of go?", ["goed", "gone", "went", "going"], 2], ["English: Choose the correct sentence.", ["She play football.", "She plays football.", "She playing football.", "She played football now."], 1], ["English: important means?", ["สำคัญ", "รวดเร็ว", "สวยงาม", "ยาก"], 0], ["English: If I am tired, I should ____.", ["sleep", "sleeps", "sleeping", "slept"], 0], ["English: Which is an adjective?", ["quickly", "beautiful", "run", "teacher"], 1], ["สังคม: รัฐธรรมนูญมีความสำคัญอย่างไร?", ["กำหนดกติกาพื้นฐานของประเทศ", "กำหนดราคาสินค้า", "กำหนดอากาศ", "กำหนดเวลาเรียน"], 0], ["สังคม: การเลือกตั้งเกี่ยวข้องกับหลักการใด?", ["ประชาธิปไตย", "ผูกขาด", "เผด็จการ", "ศักดินา"], 0], ["เศรษฐศาสตร์: ความต้องการซื้อเพิ่ม แต่สินค้ามีเท่าเดิม ราคามีแนวโน้ม?", ["ลดลง", "เพิ่มขึ้น", "เท่าเดิมเสมอ", "ศูนย์"], 1], ["ภูมิศาสตร์: เครื่องมือแสดงตำแหน่งและพื้นที่คือ?", ["แผนที่", "เครื่องคิดเลข", "นาฬิกา", "ปฏิทิน"], 0], ["ประวัติศาสตร์: หลักฐานทางประวัติศาสตร์ช่วยอะไร?", ["ศึกษาความเป็นมาในอดีต", "ทำนายอนาคตแน่นอน", "แทนคณิตศาสตร์", "บอกอากาศ"], 0], ["เทคโนโลยี: อัลกอริทึมคืออะไร?", ["ขั้นตอนแก้ปัญหาเป็นลำดับ", "โปรแกรมวาดรูป", "อุปกรณ์ไฟฟ้า", "ชนิดไฟล์ภาพ"], 0], ["เทคโนโลยี: HTML ใช้ทำอะไรเป็นหลัก?", ["สร้างโครงสร้างเว็บ", "คำนวณภาษี", "ตัดต่อเสียง", "เพิ่มอินเทอร์เน็ต"], 0], ["เทคโนโลยี: CSS ใช้ทำอะไร?", ["ตกแต่งหน้าเว็บ", "สร้างระบบปฏิบัติการ", "เพิ่มความเร็วเน็ต", "เก็บรูป"], 0], ["การคิดวิเคราะห์: ทดลองแล้วผลไม่ตรงที่คาด ควรทำอย่างไร?", ["ตรวจสอบข้อมูลและวิธีทดลองแล้วปรับปรุง", "เปลี่ยนคำตอบทันที", "ลบทิ้ง", "หยุดเสมอ"], 0]];let i=0,life=3,score=0,combo=0,t=20,timer,locked=false,cutUsed=false,freezeUsed=false;
function start(){startEl();show()}function startEl(){document.getElementById("start").classList.add("hidden");document.getElementById("game").classList.remove("hidden")}
function show(){locked=false;clearInterval(timer);let x=qs[i];lv.textContent=Math.floor(i/3)+1;qn.textContent=i+1;lifeEl();question.textContent=x[0];answers.innerHTML="";x[1].forEach((a,n)=>{let b=document.createElement("button");b.textContent=(n+1)+". "+a;b.onclick=()=>answer(n);answers.appendChild(b)});t=20;tick();timer=setInterval(()=>{t--;tick();if(t<=0){clearInterval(timer);answer(-1)}},1000)}
function lifeEl(){lifeEl2();scoreEl();comboEl()}function lifeEl2(){life.textContent=life}function scoreEl(){document.getElementById("score").textContent=score}function comboEl(){document.getElementById("combo").textContent=combo}function tick(){time.textContent=t;fill.style.width=(t*5)+"%"}
function answer(n){if(locked)return;locked=true;clearInterval(timer);let x=qs[i],ok=n===x[2];document.querySelectorAll("#answers button").forEach(b=>b.disabled=true);if(ok){combo++;let gain=100+t*10+combo*15;score+=gain;msg.innerHTML='<p class="good">ถูกต้อง! +'+gain+' คะแนน</p>'}else{life--;combo=0;msg.innerHTML='<p class="bad">'+(n===-1?"หมดเวลา!":"ยังไม่ถูก")+' คำตอบคือ '+(x[2]+1)+". "+x[1][x[2]]+"</p>";lifeEl2()}scoreEl();comboEl();setTimeout(()=>{msg.innerHTML="";if(life<=0)end(false);else if(i===qs.length-1)end(true);else{i++;show()}},900)}
function cut(){if(cutUsed||locked)return;cutUsed=true;document.getElementById("cut").disabled=true;let c=qs[i][2],bs=[...document.querySelectorAll("#answers button")];bs.map((b,n)=>n).filter(n=>n!==c).sort(()=>Math.random()-.5).slice(0,2).forEach(n=>bs[n].style.visibility="hidden")}
function freeze(){if(freezeUsed||locked)return;freezeUsed=true;document.getElementById("freeze").disabled=true;clearInterval(timer);setTimeout(()=>{if(!locked)timer=setInterval(()=>{t--;tick();if(t<=0){clearInterval(timer);answer(-1)}},1000)},5000)}
function end(win){clearInterval(timer);game.classList.add("hidden");document.getElementById("end").classList.remove("hidden");final.textContent="คะแนน "+score;title.textContent=win?"🎉 ผ่านครบ 10 ด่าน!":"💥 เกมจบ";result.textContent=win?"ตอบครบทั้ง 30 ข้อแล้ว เก่งมาก!":"ลองใหม่เพื่อทำคะแนนให้สูงขึ้น"}
</script></body></html>
